server.port=${SERVER_PORT:9090}
server.servlet.context-path=/MIMS
spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:true}
spring.datasource.url=${MIMS_DB_URL:jdbc:oracle:thin:@localhost:1521:xe}
spring.datasource.username=${MIMS_DB_USERNAME:mims}
spring.datasource.password=${MIMS_DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=${MIMS_DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${MIMS_DB_MIN_IDLE:2}
spring.sql.init.mode=never
server.error.include-message=never
